<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Shop Patitas</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <header class="encabezado">
        <h1>Pet Shop Patitas</h1>
        <p>Catálogo de productos</p>
    </header>

    <main class="principal">
        <!-- ================= Catálogo ================= -->
        <section class="seccion ancha">
            <h2>Catálogo</h2>

            <div id="filtroCategorias" class="filtro-categorias">
                Cargando categorías...
            </div>

            <div id="grillaProductos" class="grilla-productos">
                Cargando productos...
            </div>
        </section>

        <!-- ================= Alta ================= -->
        <section class="seccion">
            <h2>Nuevo producto</h2>

            <form id="formProducto">
                <label for="categoria">Categoría</label>
                <select id="categoria" required>
                    <option value="">Cargando...</option>
                </select>

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" maxlength="80"
                    placeholder="Ej: Correa retráctil 5 m" required>

                <label for="precio">Precio ($)</label>
                <input type="number" id="precio" min="1" step="0.01"
                    placeholder="Ej: 24800" required>

                <label for="stock">Stock inicial</label>
                <input type="number" id="stock" min="0" step="1" value="0" required>

                <button type="submit" class="btn btn-principal">Guardar</button>
            </form>

            <p id="mensajeForm" class="mensaje"></p>

        </section>
    </main>

    <footer class="pie">
       Desarrollo de Software· Instituto Superior Villa del Rosario · 2026
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
